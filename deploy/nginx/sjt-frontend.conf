# ShuJieTai 前端容器（nginx:alpine）站点配置：
#   - 静态托管 vite build 产物（SPA hash 路由，仍兜底 try_files）
#   - /api 同域反代 backend 容器（含 /api/v1/ws 的 WebSocket 升级）
# resolver + 变量 proxy_pass：backend 每次部署重建会换容器 IP，静态
# proxy_pass 会 502（taskdeck PR #21 的教训，勿改回）。
# WebSocket 升级头映射（http 上下文）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # vite 产物带内容 hash，可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket（/api/v1/ws）升级；无升级头时 Connection 透传为空串无害
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # dispatch 事件流可能长时间静默
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
