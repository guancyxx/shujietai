# 云服务器（132.232.249.122）nginx vhost —— sjt.guancyxx.cn
# 安装（2026-09-17 已完成，留档供重建）：
#   sudo cp sjt.guancyxx.cn.conf /etc/nginx/sites-available/sjt.guancyxx.cn
#   sudo ln -s /etc/nginx/sites-available/sjt.guancyxx.cn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 证书：certbot (Let's Encrypt) 自动签发 + certbot.timer 续期，与同机 git.guancyxx.cn
# 同模式。若日后统一换 TrustAsia：改回 /etc/nginx/ssl/sjt.guancyxx.cn_bundle.pem
# + .key（文件属 ubuntu、600）后 reload。
# 流量路径：公网 → 本 vhost 443 TLS 终结 → Tailscale → NAS 100.117.242.15:8400（前端容器）。

server {
    listen 80;
    server_name sjt.guancyxx.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sjt.guancyxx.cn;

    ssl_certificate /etc/letsencrypt/live/sjt.guancyxx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sjt.guancyxx.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    client_max_body_size 20m;

    location / {
        proxy_pass http://100.117.242.15:8400;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（/api/v1/ws）长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
