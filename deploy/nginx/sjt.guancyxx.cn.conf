# 云服务器（132.232.249.122）nginx vhost —— sjt.guancyxx.cn
# 由 galen 安装（agent 禁 SSH 该服务器）：
#   sudo cp sjt.guancyxx.cn.conf /etc/nginx/sites-available/sjt.guancyxx.cn
#   sudo ln -s /etc/nginx/sites-available/sjt.guancyxx.cn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 证书路径按 TrustAsia 实际签发位置调整（参照同机 tasks.guancyxx.cn / guancyxx.cn 站点）。
# 流量路径：公网 → 本 vhost 443 TLS 终结 → Tailscale → NAS 100.117.242.15:8400（前端容器）。

server {
    listen 80;
    listen [::]:80;
    server_name sjt.guancyxx.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sjt.guancyxx.cn;

    ssl_certificate     /etc/nginx/ssl/sjt.guancyxx.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sjt.guancyxx.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location / {
        proxy_pass http://100.117.242.15:8400;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket（/api/v1/ws）长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
